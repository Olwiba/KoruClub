services:
  koruclub:
    build: .
    container_name: koruclub-bot
    volumes:
      - koruclub_auth:/app/.wwebjs_auth
    environment:
      - ADMIN_CHAT_ID=${ADMIN_CHAT_ID}
      - TARGET_GROUP_ID=${TARGET_GROUP_ID}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    restart: unless-stopped

volumes:
  koruclub_auth:
